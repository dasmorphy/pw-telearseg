<header class="navbar" [class.scroll]="isMenuOpen">
  <nav class="navbar-container">
    <!-- Logo -->
    <div  class="navbar-logo ml-5">
      <img width="200px" height="110px" src="./assets/logo_telearseg.svg" alt="logo">
    </div>

    <!-- Navigation Menu -->
    <ul class="navbar-menu" [class.active]="isMenuOpen">
      <li *ngFor="let item of navItems" class="nav-item">
        <a
          *ngIf="item.route; else anchorLink"
          href="javascript:void(0)"
          class="nav-link"
          (click)="navigateTo(item.route)"
        >
          {{ item.label }}
        </a>

        <ng-template #anchorLink>
          <a
            [href]="item.href"
            class="nav-link"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        </ng-template>
      </li>
    </ul>

    <!-- Social Media Icons -->
      <div class="social-icons mr-5">
        <a href="https://www.instagram.com/telearseg.ec/" target="_blank" class="social-link" title="Instagram">
          <i class="pi pi-instagram"></i>
        </a>
        <!-- <a href="https://twitter.com" target="_blank" class="social-link" title="Twitter"> -->
          <!-- <i class="pi pi-twitter"></i>
        </a> -->
        <a href="https://www.linkedin.com/company/telearseg/" target="_blank" class="social-link" title="LinkedIn">
          <i class="pi pi-linkedin"></i>
        </a>
      </div>
  </nav>
</header>
